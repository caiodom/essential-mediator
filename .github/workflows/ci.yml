name: CI

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-test-and-pack:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: Restore dependencies
      run: dotnet restore EssentialMediator.sln

    - name: Restore benchmarks
      run: dotnet restore benchmarks/EssentialMediator.Benchmarks/EssentialMediator.Benchmarks.csproj

    - name: Build with warnings as errors
      run: dotnet build EssentialMediator.sln --no-restore --configuration Release --warnaserror

    - name: Build benchmarks
      run: >-
        dotnet build benchmarks/EssentialMediator.Benchmarks/EssentialMediator.Benchmarks.csproj
        --no-restore
        --configuration Release
        --warnaserror

    - name: Test with coverage
      run: >-
        dotnet test tests/EssentialMediator.Tests/EssentialMediator.Tests.csproj
        --no-build
        --configuration Release
        --verbosity normal
        --collect:"XPlat Code Coverage"
        --results-directory ./TestResults

    - name: Enforce coverage thresholds
      run: >-
        python3 scripts/check-coverage.py
        --pattern "TestResults/**/coverage.cobertura.xml"
        --min-line 90
        --min-branch 80

    - name: Pack EssentialMediator.Abstractions
      run: >-
        dotnet pack src/EssentialMediator.Abstractions/EssentialMediator.Abstractions.csproj
        --no-build
        --configuration Release
        --output ./artifacts/packages

    - name: Pack EssentialMediator
      run: >-
        dotnet pack src/EssentialMediator/EssentialMediator.csproj
        --no-build
        --configuration Release
        --output ./artifacts/packages

    - name: Pack EssentialMediator.Extensions.DependencyInjection
      run: >-
        dotnet pack src/EssentialMediator.Extensions.DependencyInjection/EssentialMediator.Extensions.DependencyInjection.csproj
        --no-build
        --configuration Release
        --output ./artifacts/packages

    - name: Upload coverage results
      if: ${{ always() && hashFiles('TestResults/**/coverage.cobertura.xml') != '' }}
      uses: actions/upload-artifact@v6
      with:
        name: coverage-results
        path: TestResults/**/coverage.cobertura.xml
        if-no-files-found: error

    - name: Upload NuGet packages
      uses: actions/upload-artifact@v6
      with:
        name: nuget-packages
        path: artifacts/packages/*.nupkg
        if-no-files-found: error

    - name: Upload NuGet symbol packages
      uses: actions/upload-artifact@v6
      with:
        name: nuget-symbol-packages
        path: artifacts/packages/*.snupkg
        if-no-files-found: error
